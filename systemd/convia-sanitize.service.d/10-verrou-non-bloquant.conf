# Verrou occupe != panne. Le sanitizer est un polling de 10 min : si l analyse
# nocturne tient le verrou partage (un run dure ~20 min), il n y a rien a signaler,
# le tick suivant repassera. Sans -E 0, flock sort en 1 et l unite part en failed,
# ce qui a declenche une fausse alerte Telegram le 2026-08-14 17:10 UTC.
[Service]
ExecStart=
ExecStart=/usr/bin/flock -w 300 -E 0 /var/lib/convia/convia.lock /usr/bin/python3 /usr/local/bin/convia_sanitize.py
