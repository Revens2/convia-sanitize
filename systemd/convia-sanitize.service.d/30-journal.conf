# Journalisation : sans SyslogIdentifier, les lignes du runner sont attribuees
# a l identifiant "flock", ce qui brouille la lecture. Cause reelle du journal
# "vide" : juliann n etait pas dans le groupe systemd-journal (corrige).
[Service]
StandardOutput=journal
StandardError=journal
SyslogIdentifier=convia-sanitize
