# Publication RAG DECOUPLEE (mission 4, 2026-09-07) : le publish vit dans
# convia-publish.service. Declenchement NON bloquant apres chaque succes du
# sanitizer via OnSuccess= (systemd >= 243) : convia-sanitize.service se
# termine des que la sanitization est finie, sans attendre la copie vers le
# RAG. Le publisher est une unite oneshot unique : jamais deux copies
# concurrentes (les declenchements pendant une publication sont serialises par
# systemd, jamais paralleles).
[Unit]
OnSuccess=convia-publish.service
